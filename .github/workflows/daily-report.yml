name: Daily Macro Report

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 08:00 Asia/Taipei, every day (workday gate runs inside the job)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-macro-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Check workday
        id: workday
        run: python scripts/check_workday.py

      - name: Generate report (Claude + web search)
        if: steps.workday.outputs.is_workday == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py --out-dir "reports/${{ steps.workday.outputs.report_date }}"

      - name: Render card image
        if: steps.workday.outputs.is_workday == 'true'
        run: |
          python scripts/make_card.py \
            "reports/${{ steps.workday.outputs.report_date }}/report.json" \
            "reports/${{ steps.workday.outputs.report_date }}/card.png"

      - name: Commit report assets
        if: steps.workday.outputs.is_workday == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "reports/${{ steps.workday.outputs.report_date }}"
          git commit -m "Daily macro report ${{ steps.workday.outputs.report_date }}"
          git push

      - name: Push to LINE groups
        if: steps.workday.outputs.is_workday == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_IDS: ${{ secrets.LINE_GROUP_IDS }}
        run: |
          DATE="${{ steps.workday.outputs.report_date }}"
          BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/reports/${DATE}"
          python scripts/push_line.py \
            --image-url "${BASE_URL}/card.png" \
            --preview-url "${BASE_URL}/card_preview.png" \
            --text-file "reports/${DATE}/line_text.txt"
